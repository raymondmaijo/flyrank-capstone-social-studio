version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: social-studio-db
    environment:
      POSTGRES_DB: social_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: social-studio-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: social-studio-app
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/social_studio
      REDIS_URL: redis://redis:6379/0
      SOCIAL_ADAPTER: mock_x
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
